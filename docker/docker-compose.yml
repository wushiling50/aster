  filebeat: # 权限问题执行 sudo chmod go-w (挂载目录)/filebeat.yml
    image: elastic/filebeat:8.17.1
    container_name: aster-filebeat
    user: root
    volumes:
      - ../config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml # 挂载配置文件
      - ./data/filebeat:/usr/share/filebeat/data  # 持久化注册表文件
      - ../log:/usr/share/filebeat/logs  # 挂载日志目录
    depends_on:
      - openobserve
    restart: on-failure
    networks:
      - aster

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.15.0-rc1
    container_name: aster-openobserve
    restart: always
    env_file:
      - ./env/openobserve.env
    ports:
      - "5080:5080"
    volumes:
      - ./data/openobserve:/data
    networks:
      - aster

  jaeger:
    container_name: aster-jaeger
    hostname: jaeger
    image: "jaegertracing/all-in-one:latest"
    restart: always
    ports:
      - 16686:16686
      - 14268:14268
      - 6831:6831/udp
    volumes:
      - ./data/jaeger:/var/lib/jaeger
      - ../config/jaeger:/etc/jaeger
    networks:
      - aster

  prometheus:
    image: prom/prometheus
    container_name: aster-prometheus
    hostname: prometheus
    restart: always
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - aster

  grafana:
    image: grafana/grafana
    container_name: aster-grafana
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ../config/grafana:/etc/grafana
    networks:
      - aster

  alertmanager: #预警模块
    image: prom/alertmanager
    container_name: aster-alertmanager
    restart: always
    ports:
      - 9193:9093
    networks:
      - aster

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: aster-node-exporter
    restart: always
    ports:
      - 9100:9100
    networks:
      - aster

  cadvisor:
    image: zcube/cadvisor:latest # 静态编译版本，兼容性更好
    container_name: aster-cadvisor
    restart: always
    platform: linux/amd64
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - 8899:8080
    networks:
      - aster

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: aster-redis-exporter
    restart: always
    ports:
      - 9121:9121
    command:
      - "--redis.addr=redis://redis:6379"
    networks:
      - aster

  mysql-exporter:
    image: prom/mysqld-exporter
    container_name: aster-mysql-exporter
    restart: always
    ports:
      - 9104:9104
    command:
      - "--mysqld.username=aster:aster"
      - "--mysqld.address=mysql:3306"
    environment:
      DATA_SOURCE_NAME: 'aster:aster@(mysql:3306)/'
    depends_on:
      - mysql
    networks:
      - aster

  asynqmon:
    image: hibiken/asynqmon:latest  # 使用最新版
    container_name: aster-asynqmon-dashboard
    restart: always
    ports:
      - 6380:8080 
    env_file:
      - "./env/asynqmon.env"
    depends_on:
      - redis
    networks:
      - aster

networks:
  aster:
    driver: bridge
    name: aster