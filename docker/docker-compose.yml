services:
  redis:
    container_name: aster-redis
    hostname: redis
    image: redis:bookworm # 选择使用 redis 官方的 bookworm tag
    ports:
      - "6379:6379"
    env_file:
      - "./env/redis.env"
    volumes:
      - ./data/redis:/data
    networks:
      - aster

  mysql:
    container_name: aster-mysql
    hostname: mysql
    image: mysql:9.0.1 # 选择使用 mysql 官方的 9.0.1 版本
    ports:
      - "3306:3306"
    env_file:
      - "./env/mysql.env"
    volumes:
      - ../config/sql:/docker-entrypoint-initdb.d
      - ./data/mysql:/var/lib/mysql
      - ../config/mysql/mysql.cnf:/etc/mysql/conf.d/slowlog.cnf
      - ../log/sql:/var/log/mysql
    networks:
      - aster

  etcd:
    container_name: aster-etcd
    hostname: etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    ports:
      - 2379:2379
      - 2380:2380
    env_file:
      - "./env/etcd.env"
    volumes:
      - ./data/etcd:/etcd-data
    networks:
      - aster

  etcd-keeper:
    container_name: aster-etcdkeeper
    image: evildecay/etcdkeeper
    env_file:
      - "./env/etcd-keeper.env"
    ports:
      - 8099:8080
    depends_on:
      - etcd
    networks:
      - aster

  zookeeper:
    container_name: aster-zookeeper
    hostname: zookeeper
    image: zookeeper:latest
    restart: always
    ports:
      - 2181:2181
    volumes:
      - ./data/zookeeper/data:/data
      - ./data/zookeeper/datalog:/datalog
      - ./data/zookeeper/logs:/logs
    networks:
      - aster

  kafka:
    container_name: aster-kafka
    hostname: kafka
    image: wurstmeister/kafka:latest
    restart: always
    ports:
      - 9092:9092
    env_file:
      - "./env/kafka.env"
    volumes:
      - ./data/kafka:/kafka
    depends_on:
      - zookeeper
    networks:
      - aster
      
  kafka-ui:
    container_name: aster-kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "9091:8080"
    env_file:
      - ./env/kafka-ui.env
    networks:
      - aster

