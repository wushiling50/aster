Name: applet
Host: 0.0.0.0
Port: 20001
Mode: dev
TimeOut: 60000

# dev 环境模式配置
DevServer:
  Enabled: true
  Port: 5003

# 日志配置
Log:
  ServiceName: applet
  Mode: file
  Encoding: json
  Path: log/applet/

# 链路追踪​
Telemetry:
  Name: applet
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Snowflake:
  WorkerId: 0
  DatancenterId: 0

Mysql:
  Addr: mysql:3306
  Database: aster
  Username: aster
  Password: aster
  Charset: utf8mb4

Redis:
  Host: redis:6379
  Type: node
  Pass: aster

Cache:
  - Host: redis:6379
    Pass: aster

AsynqRedisConf:
  Addr: redis:6379
  Pass: aster
  DB: 0

# RPC 服务配置
Services:
  Developer:
    Etcd:
      Hosts:
      - etcd:2379
      Key: developer.rpc
    Timeout: 60000

  Analysis:
    Etcd:
      Hosts:
      - etcd:2379
      Key: analysis.rpc
    Timeout: 60000

  IdGenerator:
    Etcd:
      Hosts:
      - etcd:2379
      Key: idgenerator.rpc
    Timeout: 60000