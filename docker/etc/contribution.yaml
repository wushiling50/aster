Name: contribution.rpc
ListenOn: 0.0.0.0:20003
Mode: dev
Timeout: 3000

Etcd:
  Hosts:
  - etcd:2379
  Key: contribution.rpc

# dev 环境模式配置
DevServer:
  Enabled: true
  Port: 5006

# 日志配置
Log:
  ServiceName: contribution.rpc
  Mode: file
  Encoding: json
  Path: log/contribution_rpc/

# 链路追踪​
Telemetry:
  Name: contribution.rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Snowflake:
  WorkerId: 0
  DatancenterId: 0

Mysql:
  Addr: mysql:3306
  Database: aster
  Username: aster
  Password: aster
  Charset: utf8mb4

Cache:
  - Host: redis:6379
    Pass: aster

RedisClient:
  Host: redis:6379
  Type: node
  Pass: aster

AsynqRedisConf:
  Addr: redis:6379
  Pass: aster
  DB: 0

KqContributionConsumerConf:
  Name: contribution-consumer
  Brokers:
    - kafka:9092
  Group: contribution
  Topic: contribution-update