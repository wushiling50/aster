Name: apiProcessor
Mode: dev

# dev 环境模式配置
DevServer:
  Enabled: true
  Port: 5005

# 日志配置
Log:
  ServiceName: apiProcessor
  Mode: file
  Encoding: json
  Path: log/api_processor/

# 链路追踪​
Telemetry:
  Name: apiProcessor
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

AsynqRedisConf:
  Addr: 127.0.0.1:6379
  Pass: aster
  DB: 0

# RPC 服务配置
Services:
  Analysis:
    Etcd:
      Hosts:
      - 127.0.0.1:2379
      Key: analysis.rpc
    Timeout: 60000