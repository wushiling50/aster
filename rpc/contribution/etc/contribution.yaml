Name: contribution.rpc
ListenOn: 0.0.0.0:20003
Mode: dev
Timeout: 60000

Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: contribution.rpc

# dev 环境模式配置
DevServer:
  Enabled: true
  Port: 5006

# 日志配置
Log:
  ServiceName: contribution.rpc
  Mode: file
  Encoding: json
  Path: log/contribution_rpc/

# 链路追踪​
Telemetry:
  Name: contribution.rpc
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Snowflake:
  WorkerId: 0
  DatancenterId: 0

Mysql:
  Addr: 127.0.0.1:3306
  Database: aster
  Username: aster
  Password: aster
  Charset: utf8mb4

Cache:
  - Host: 127.0.0.1:6379
    Pass: aster

RedisClient:
  Host: 127.0.0.1:6379
  Type: node
  Pass: aster

AsynqRedisConf:
  Addr: 127.0.0.1:6379
  Pass: aster
  DB: 0

KqContributionConsumerConf:
  Name: contribution-consumer
  Brokers:
    - 127.0.0.1:9092
  Group: contribution
  Topic: contribution-update