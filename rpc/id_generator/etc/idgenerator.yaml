Name: idgenerator.rpc
ListenOn: 0.0.0.0:20005
Mode: dev
Timeout: 3000

Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: idgenerator.rpc

Log:
  ServiceName: idgenerator.rpc
  Mode: file
  Encoding: json
  Path: log/idgenerator_rpc/

DevServer:
  Enabled: true
  Port: 6003

Telemetry:
  Name: idgenerator.rpc
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass:
  Key: idgenerator-rpc